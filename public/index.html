<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Poker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home: pick a name, create or join a table -->
  <main id="home" class="screen">
    <div class="home-card">
      <h1 class="logo"><span>♠</span> Pocket Poker</h1>
      <p class="tagline">Texas Hold'em with friends. Play money only, no real euros.</p>

      <label class="field">
        <span>Your name</span>
        <input id="name" maxlength="16" autocomplete="nickname" placeholder="e.g. Sam">
      </label>

      <div class="home-split">
        <section class="panel">
          <h2>Start a table</h2>
          <div class="row">
            <label class="field">
              <span>Starting money</span>
              <select id="startingChips">
                <option value="500">€500</option>
                <option value="1000" selected>€1,000</option>
                <option value="2500">€2,500</option>
                <option value="5000">€5,000</option>
                <option value="10000">€10,000</option>
              </select>
            </label>
            <label class="field">
              <span>Blinds</span>
              <select id="bigBlind">
                <option value="10">€5 / €10</option>
                <option value="20" selected>€10 / €20</option>
                <option value="50">€25 / €50</option>
                <option value="100">€50 / €100</option>
              </select>
            </label>
          </div>
          <button id="createBtn" class="btn primary wide">Create table</button>
        </section>

        <section class="panel">
          <h2>Join a table</h2>
          <label class="field">
            <span>Table code</span>
            <input id="code" maxlength="5" autocomplete="off" placeholder="ABCDE" class="code-input">
          </label>
          <button id="joinBtn" class="btn wide">Join table</button>
        </section>
      </div>
      <p id="homeError" class="error" role="alert"></p>
    </div>
  </main>

  <!-- Game -->
  <main id="game" class="screen hidden">
    <header class="topbar">
      <div class="room">
        <span class="label">Table</span>
        <strong id="roomCode">-----</strong>
        <button id="copyBtn" class="btn small">Copy invite</button>
      </div>
      <div class="top-actions">
        <button id="camBtn" class="btn small cam-btn" title="Video call">📷 <span>Camera</span></button>
        <button id="micBtn" class="btn small cam-btn hidden" title="Mute or unmute">🎤 <span>Mute</span></button>
        <button id="sitoutBtn" class="btn small ghost">Sit out</button>
        <button id="leaveBtn" class="btn small ghost">Leave</button>
      </div>
    </header>

    <div class="layout">
      <div class="table-wrap">
        <div id="felt" class="felt">
          <div class="center">
            <div id="board" class="board"></div>
            <div id="pot" class="pot"></div>
            <div id="result" class="result"></div>
          </div>
          <div id="seats"></div>
        </div>

        <div id="controls" class="controls"></div>
      </div>
    </div>
    <div id="bigVideo" class="big-video hidden" title="Click to close"></div>
    <div id="toast" class="toast" role="status"></div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="video.js"></script>
  <script src="app.js"></script>
</body>
</html>
